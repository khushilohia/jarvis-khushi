[project]
name = "jarvis"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "khushilohia", email = "b.lohia1607@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "anthropic>=2.3.0",
    "duckduckgo-search>=8.1.1",
    "fastapi>=0.162.0",
    "faster-whisper>=1.2.1",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "pyyaml>=6.0.3",
    "sounddevice>=0.5.6",
    "uvicorn>=0.54.0",
]

[project.scripts]
jarvis = "jarvis:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
